# Research App SSR 镜像构建配置

# 镜像名称和标签
RESEARCH_SSR_IMAGE="research-web-frontend"
RESEARCH_SSR_TAG="1.0.0"   # 本地固定版本；CI 构建使用 git SHA，由 Kaniko --destination 传入

# 源代码路径（相对于项目根目录）
# 项目结构: research-web-frontend/
#   - app/          (源代码目录)
#   - mybuild/      (构建脚本目录)
SOURCE_DIR="app"

# 构建选项
DOCKERFILE="Dockerfile"
BUILD_CONTEXT="."

# 容器运行时选择
# 选择使用的容器运行时命令
# - docker:     使用 docker 命令（默认）
# - sudo nerdctl: 使用 sudo nerdctl 命令（适用于 containerd 环境）
CONTAINER_RUNTIME="docker"

# nerdctl 配置（仅在 CONTAINER_RUNTIME 为 nerdctl 时生效）
# nerdctl 命名空间，用于指定 containerd 的命名空间
# - default: 默认命名空间
# - k8s.io: Kubernetes 命名空间（推荐，用于与 Kubernetes 共享镜像）
NERDCTL_NAMESPACE="k8s.io"

# 镜像仓库配置
# Harbor 镜像仓库配置（用于推送镜像）
RESEARCH_SSR_IMAGE_REGISTRY="${RESEARCH_SSR_IMAGE_REGISTRY:-harbor.sunmoonai.com}"  # 镜像仓库地址
RESEARCH_SSR_IMAGE_PROJECT="${RESEARCH_SSR_IMAGE_PROJECT:-app-images}"                   # 镜像项目名
REGISTRY="${REGISTRY:-harbor.sunmoonai.com:30443/k8s-images}"     # 传给 Dockerfile --build-arg REGISTRY，用于基础镜像拉取

# 镜像推送配置
# 是否在构建后自动推送镜像到镜像仓库
# - true:  构建完成后自动推送镜像到镜像仓库
# - false: 构建完成后不推送镜像，需要手动推送（默认）
PUSH_IMAGES_AFTER_BUILD="${PUSH_IMAGES_AFTER_BUILD:-false}"
