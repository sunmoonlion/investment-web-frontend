# Investment Web Frontend image build config
# build-image.sh still reads TPL_SSR_* variable names from the template script.
TPL_SSR_IMAGE="investment-web-frontend"
TPL_SSR_TAG="architecture-v2-dev"   # 本地开发标签；正式发布由独立发布流程管理
SOURCE_DIR="app"
DOCKERFILE="Dockerfile"
BUILD_CONTEXT="."
CONTAINER_RUNTIME="docker"
NERDCTL_NAMESPACE="k8s.io"
TPL_SSR_IMAGE_REGISTRY="${TPL_SSR_IMAGE_REGISTRY:-harbor.sunmoonai.com}"
TPL_SSR_IMAGE_PROJECT="${TPL_SSR_IMAGE_PROJECT:-app-images}"
REGISTRY="${REGISTRY:-harbor.sunmoonai.com:30443/k8s-images}"
PUSH_IMAGES_AFTER_BUILD="${PUSH_IMAGES_AFTER_BUILD:-false}"
